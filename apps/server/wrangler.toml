name = "tint-server"
main = "src/index.ts"
compatibility_date = "2026-11-04"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# `*` matches exactly one subdomain label (Pages preview deploys). Add a LAN origin in .dev.vars.
ALLOWED_ORIGINS = "https://tint-and-tell.pages.dev,https://*.tint-and-tell.pages.dev,https://tint-web.tint-server.workers.dev,http://localhost:5173"
# Grok models per task (pnpm xai:probe measures them). FAST: Grok's stone and lines, where
# everyone waits. SMART: Grok's clues as cue giver and X hints. Real Grok needs the XAI_API_KEY
# secret and botMode "grok"; without either, Grok plays the fallback and the seat shows degraded.
XAI_MODEL_FAST = "grok-4.20-0309-non-reasoning"
XAI_MODEL_SMART = "grok-4.7"
# Grok speaks its lines (xAI /v1/tts, one MP3 per line). "off" is the kill switch.
XAI_TTS = "on"
XAI_TTS_VOICE = "eve"
# "Dopytaj Groka" hints (Responses API + x_search, ~3 cents each). "off" is the kill switch.
XAI_HINTS = "on"
# Online stone timeout. Overridable so e2e can run fast: --var TURN_TIMEOUT_MS:1500
TURN_TIMEOUT_MS = "60000"

# Per-IP limits (period 10 or 60 s). Generous on purpose, since a whole demo table can share one
# venue IP. They stop room-code enumeration (31^5 codes) and room spam, not normal play.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "WS_LIMIT"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

# One fetch per Grok line per player: generous, but it stops a script hammering the MP3 route.
[[ratelimits]]
name = "SAY_LIMIT"
namespace_id = "1004"
simple = { limit = 300, period = 60 }

# Secrets: wrangler secret put XAI_API_KEY (never in this file). Local: .dev.vars (gitignored).
