name = "tint-server"
main = "src/index.ts"
compatibility_date = "2026-11-04"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
ALLOWED_ORIGINS = "https://tint-and-tell.pages.dev,http://localhost:5173"
# Confirm the model id on docs.x.ai (p1/grok). Unused until the xAI client lands.
XAI_MODEL = ""
# Online stone timeout. Overridable so e2e can run fast: --var TURN_TIMEOUT_MS:1500
TURN_TIMEOUT_MS = "60000"

# Per-IP limits (period 10 or 60 s). Generous on purpose, since a whole demo table can share one
# venue IP. They stop room-code enumeration (31^5 codes) and room spam, not normal play.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "WS_LIMIT"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

# Secrets: wrangler secret put XAI_API_KEY (never in this file). Local: .dev.vars (gitignored).
